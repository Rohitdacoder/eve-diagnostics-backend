x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://eve:eve@db:5432/eve
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  SECRET_KEY: ${SECRET_KEY:-local-dev-secret-key-change-me-in-production}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-dev-webhook-secret-change-me-in-prod}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      SEED_DATA: ${SEED_DATA:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["celery", "-A", "app.worker", "worker", "--beat", "--loglevel=info", "-s", "/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  pgdata:
