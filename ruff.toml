line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI uses Depends()/Query() in argument defaults on purpose
ignore = ["B008", "UP042", "UP046"]  # keep (str, Enum) and Generic[T], pydantic handles both fine

[lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
